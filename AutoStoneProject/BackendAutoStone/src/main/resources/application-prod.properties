# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
# No production secret or infrastructure path has a fallback on purpose.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

autostone.remote.ssh-user=${AUTOSTONE_SSH_USER}
autostone.remote.ssh-key-path=${AUTOSTONE_SSH_KEY_PATH}
autostone.remote.ssh-port=${AUTOSTONE_SSH_PORT:22}
autostone.remote.wrapper-path=${AUTOSTONE_WRAPPER_PATH:/opt/autostone/wrapper.sh}
autostone.remote.callback-base-url=${AUTOSTONE_CALLBACK_BASE_URL}
autostone.remote.callback-secret=${AUTOSTONE_CALLBACK_SECRET}
autostone.remote.callback-secret-file=${AUTOSTONE_CALLBACK_SECRET_FILE:/etc/autostone/callback-secret}
autostone.web.allowed-origins=${AUTOSTONE_ALLOWED_ORIGINS}
