spring.application.name=autostone
server.port=${SERVER_PORT:8081}

# Database - never commit real production credentials. Set DB_* environment variables.
#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autostone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
#spring.datasource.username=root
#spring.datasource.password=root
#spring.datasource.driver-class-name=org.postgresql.Driver
# PostgreSQL Database
# MySQL database on your Windows laptop
spring.datasource.url=jdbc:postgresql://localhost:5432/autostone
spring.datasource.username=postgres
spring.datasource.password=PgSql@#123
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Quartz. The job table remains the schedule source of truth and triggers are rebuilt on startup.
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.threadPool.threadCount=${QUARTZ_THREADS:10}

