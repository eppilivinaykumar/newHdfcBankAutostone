# ============================================================
# Remote execution - AWS EC2
# ============================================================

autostone.remote.ssh-user=root
autostone.remote.ssh-key-path=/root/.ssh/id_rsa
autostone.remote.ssh-port=22
autostone.remote.connect-timeout-ms=10000

# Wrapper installed on AWS EC2
autostone.remote.wrapper-path=/app/autostone/StartWrapper.sh

# Callback configuration
autostone.remote.callback-base-url=http://10.227.68.157:8081
autostone.remote.callback-secret=change-me
#autostone.remote.callback-secret-file=${AUTOSTONE_CALLBACK_SECRET_FILE:/etc/autostone/callback-secret}
autostone.remote.callback-secret-file=/home/ec2-user/autostone/callback-secret
# Hosts that should be treated as local
autostone.remote.local-hostnames=localhost,127.0.0.1

# Logging
logging.level.com.mybank.autostone=${LOG_LEVEL:INFO}
logging.level.org.quartz=WARN
autostone.web.allowed-origins=http://10.227.68.157:5173